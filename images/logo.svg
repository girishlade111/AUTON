<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- hero .wordmark-gradient: ffffff 0 / e8e8e8 35 / 6a6a6a 78 / 3f3f42 100 -->
    <linearGradient id="ink" x1="0" y1="128" x2="0" y2="384" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#e8e8e8"/>
      <stop offset="0.78" stop-color="#6a6a6a"/>
      <stop offset="1" stop-color="#3f3f42"/>
    </linearGradient>
    <!-- surface.base lifted by surface.muted -->
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161618"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <!-- bottom vignette -->
    <linearGradient id="vig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.24"/>
    </linearGradient>
    <!-- top studio sheen -->
    <radialGradient id="sheen" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- hairline ring: brighter top -->
    <linearGradient id="ringg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.055"/>
    </linearGradient>
    <!-- bevel highlight (top edges of letters) -->
    <linearGradient id="bevel" x1="0" y1="128" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bevelBar" x1="0" y1="256" x2="0" y2="272" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- --color-accent bar: #5eea8a -> #16a34a -->
    <linearGradient id="barg" x1="0" y1="256" x2="0" y2="316" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5eea8a"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <!-- G aperture cut -->
    <mask id="gcut">
      <rect width="512" height="512" fill="#fff"/>
      <path d="M184 256 L246 139.5 A132 132 0 0 1 315.9 251.4 Z" fill="#000"/>
    </mask>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="glowf" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#plate)"/>
  <circle cx="110" cy="20" r="270" fill="url(#sheen)"/>
  <rect width="512" height="512" rx="116" fill="url(#vig)"/>
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="url(#ringg)" stroke-width="8"/>

  <!-- letter drop shadow -->
  <g fill="#000000" opacity="0.5" filter="url(#soft)" transform="translate(0 14)">
    <circle cx="184" cy="256" r="98" fill="none" stroke="#000000" stroke-width="60" mask="url(#gcut)"/>
    <path d="M336 128 h60 v196 h60 v60 h-120 Z"/>
  </g>

  <!-- GL monogram -->
  <circle cx="184" cy="256" r="98" fill="none" stroke="url(#ink)" stroke-width="60" mask="url(#gcut)"/>
  <path d="M336 128 h60 v196 h60 v60 h-120 Z" fill="url(#ink)"/>
  <!-- bevel -->
  <g fill="url(#bevel)">
    <circle cx="184" cy="256" r="98" fill="none" stroke="url(#bevel)" stroke-width="60" mask="url(#gcut)"/>
    <path d="M336 128 h60 v196 h60 v60 h-120 Z"/>
  </g>

  <!-- accent bar with glow (site label-glow) -->
  <rect x="184" y="256" width="128" height="60" rx="10" fill="#22c55e" opacity="0.6" filter="url(#glowf)"/>
  <rect x="184" y="256" width="128" height="60" rx="10" fill="url(#barg)"/>
  <rect x="184" y="256" width="128" height="60" rx="10" fill="url(#bevelBar)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- hero .wordmark-gradient: ffffff 0 / e8e8e8 35 / 6a6a6a 78 / 3f3f42 100 -->
    <linearGradient id="ink" x1="0" y1="96" x2="0" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#e8e8e8"/>
      <stop offset="0.78" stop-color="#6a6a6a"/>
      <stop offset="1" stop-color="#3f3f42"/>
    </linearGradient>
    <!-- surface.base #000000 lifted by surface.muted -->
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161618"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#plate)"/>
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="8"/>
  <polygon points="214,96 298,96 210,420 126,420" fill="url(#ink)"/>
  <polygon points="214,96 298,96 386,420 302,420" fill="url(#ink)"/>
  <!-- --color-accent #22c55e -->
  <rect x="164" y="292" width="184" height="58" rx="14" fill="#22c55e"/>
</svg>
